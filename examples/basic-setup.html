<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic WebGPU Setup - Graph Algorithms</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        #output {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Examples</a>
    
    <h1>Basic WebGPU Setup</h1>
    
    <p>This example demonstrates basic WebGPU initialization and a simple compute shader.</p>
    
    <h2>Output</h2>
    <div id="output">Initializing WebGPU...</div>
    
    <script type="module">
        const output = document.getElementById('output');
        
        function log(message) {
            output.innerHTML += `\n${message}`;
        }
        
        async function initWebGPU() {
            // Check for WebGPU support
            if (!navigator.gpu) {
                log('❌ WebGPU not supported');
                return;
            }
            
            try {
                // Get adapter
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    log('❌ Failed to get adapter');
                    return;
                }
                log('✅ Got adapter');
                
                // Get device
                const device = await adapter.requestDevice();
                log('✅ Got device');
                
                // Create a simple compute shader that squares numbers
                const shaderCode = `
                    @group(0) @binding(0) var<storage, read> input: array<f32>;
                    @group(0) @binding(1) var<storage, read_write> output: array<f32>;
                    
                    @compute @workgroup_size(64)
                    fn main(@builtin(global_invocation_id) global_id: vec3<u32>) {
                        let index = global_id.x;
                        if (index >= arrayLength(&input)) {
                            return;
                        }
                        output[index] = input[index] * input[index];
                    }
                `;
                
                // Create shader module
                const shaderModule = device.createShaderModule({
                    label: 'Square numbers shader',
                    code: shaderCode
                });
                log('✅ Created shader module');
                
                // Create data
                const arraySize = 128;
                const inputData = new Float32Array(arraySize);
                for (let i = 0; i < arraySize; i++) {
                    inputData[i] = i;
                }
                
                // Create buffers
                const inputBuffer = device.createBuffer({
                    label: 'Input buffer',
                    size: inputData.byteLength,
                    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
                });
                
                const outputBuffer = device.createBuffer({
                    label: 'Output buffer',
                    size: inputData.byteLength,
                    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC
                });
                
                const stagingBuffer = device.createBuffer({
                    label: 'Staging buffer',
                    size: inputData.byteLength,
                    usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST
                });
                
                // Write data to input buffer
                device.queue.writeBuffer(inputBuffer, 0, inputData);
                log('✅ Created buffers and uploaded data');
                
                // Create bind group layout and pipeline
                const bindGroupLayout = device.createBindGroupLayout({
                    entries: [
                        {
                            binding: 0,
                            visibility: GPUShaderStage.COMPUTE,
                            buffer: { type: 'read-only-storage' }
                        },
                        {
                            binding: 1,
                            visibility: GPUShaderStage.COMPUTE,
                            buffer: { type: 'storage' }
                        }
                    ]
                });
                
                const pipelineLayout = device.createPipelineLayout({
                    bindGroupLayouts: [bindGroupLayout]
                });
                
                const computePipeline = device.createComputePipeline({
                    label: 'Square compute pipeline',
                    layout: pipelineLayout,
                    compute: {
                        module: shaderModule,
                        entryPoint: 'main'
                    }
                });
                
                const bindGroup = device.createBindGroup({
                    layout: bindGroupLayout,
                    entries: [
                        { binding: 0, resource: { buffer: inputBuffer } },
                        { binding: 1, resource: { buffer: outputBuffer } }
                    ]
                });
                log('✅ Created compute pipeline');
                
                // Create command encoder and dispatch compute
                const commandEncoder = device.createCommandEncoder();
                const computePass = commandEncoder.beginComputePass();
                computePass.setPipeline(computePipeline);
                computePass.setBindGroup(0, bindGroup);
                computePass.dispatchWorkgroups(Math.ceil(arraySize / 64));
                computePass.end();
                
                // Copy output to staging buffer
                commandEncoder.copyBufferToBuffer(
                    outputBuffer, 0,
                    stagingBuffer, 0,
                    inputData.byteLength
                );
                
                // Submit commands
                device.queue.submit([commandEncoder.finish()]);
                log('✅ Submitted compute commands');
                
                // Read results
                await stagingBuffer.mapAsync(GPUMapMode.READ);
                const copyArrayBuffer = stagingBuffer.getMappedRange();
                const results = new Float32Array(copyArrayBuffer);
                
                // Display some results
                log('\n📊 Results (first 10 squared values):');
                for (let i = 0; i < 10; i++) {
                    log(`  ${i}² = ${results[i]}`);
                }
                
                stagingBuffer.unmap();
                log('\n✅ WebGPU compute shader executed successfully!');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`);
                console.error(error);
            }
        }
        
        initWebGPU();
    </script>
</body>
</html>
