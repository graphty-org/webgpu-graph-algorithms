<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Graph Algorithms - Examples</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #333;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .examples {
            margin-top: 30px;
        }
        .example-link {
            display: block;
            padding: 10px;
            margin: 10px 0;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            text-decoration: none;
            color: #007bff;
        }
        .example-link:hover {
            background: #e9ecef;
        }
    </style>
</head>
<body>
    <h1>WebGPU Graph Algorithms Examples</h1>
    
    <div id="status" class="status"></div>
    
    <div class="examples">
        <h2>Available Examples</h2>
        <a href="basic-setup.html" class="example-link">Basic WebGPU Setup</a>
        <!-- More examples will be added here -->
    </div>
    
    <script type="module">
        const statusEl = document.getElementById('status');
        
        async function checkWebGPU() {
            if (!navigator.gpu) {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ WebGPU is not supported in this browser. Please use Chrome 113+, Edge 113+, or Safari 18+.';
                return false;
            }
            
            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    statusEl.className = 'status error';
                    statusEl.textContent = '❌ Failed to get WebGPU adapter. GPU might be disabled.';
                    return false;
                }
                
                const device = await adapter.requestDevice();
                statusEl.className = 'status success';
                statusEl.textContent = '✅ WebGPU is available and ready to use!';
                
                // Log adapter info
                const info = await adapter.requestAdapterInfo();
                console.log('WebGPU Adapter Info:', info);
                
                return true;
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = `❌ Error initializing WebGPU: ${error.message}`;
                return false;
            }
        }
        
        checkWebGPU();
    </script>
</body>
</html>
