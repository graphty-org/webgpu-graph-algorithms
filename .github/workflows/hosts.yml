# .github/workflows/hosts.yml -- the host matrix: the other shader compilers (Dawn on Metal and on D3D12, WebKit).
# Informational, never a required check (a Review-log entry records it beside the two lanes of the plan's 12.1): the
# default lane (ci.yml) covers Tint on Vulkan only, and a real WebKit / Metal defect (unread pipeline constants,
# CLAUDE.md "Verified Platform Facts") was first seen on an iPad. Free GitHub runners: macos-latest is an Apple
# Silicon VM with a Metal device (Dawn-node and Chromium on Metal; Playwright's WebKit as the Safari proxy),
# windows-latest has no GPU but Dawn's D3D12 backend enumerates WARP, Microsoft's software rasterizer.
name: Hosts
on:
    push: { branches: [master] }
    pull_request:
    workflow_dispatch:
permissions: { contents: read }
concurrency:
    group: hosts-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        name: Test (${{ matrix.backend }} on ${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      backend: metal
                      node_adapter: "" # Dawn picks the runner's Metal device
                      browser_gpu: metal
                      webkit: "true"
                    - os: windows-latest
                      backend: d3d12
                      node_adapter: "Microsoft Basic Render Driver" # WARP, the software D3D12 adapter
                      browser_gpu: swiftshader
                      webkit: "false"
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        env:
            GRAPHTY_GPU_REQUIRE: any # an adapter must exist; a missing one fails the run up front (test/setup/global.ts)
            GRAPHTY_GPU_ADAPTER: ${{ matrix.node_adapter }}
            GRAPHTY_BROWSER_GPU: ${{ matrix.browser_gpu }}
        defaults: { run: { working-directory: packages/webgpu-graph-algorithms, shell: bash } }
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with: { package_json_file: packages/package.json }
            - uses: actions/setup-node@v4
              with: { node-version: 22.x, cache: pnpm, cache-dependency-path: packages/pnpm-lock.yaml }
            - run: pnpm install --frozen-lockfile
              working-directory: packages
            - run: pnpm run build
              working-directory: packages
            - name: Adapter report (informational on this lane; the JSON is uploaded)
              run: node scripts/gpu-report.js > gpu-report.json || echo "gpu-report.js exited $?"; cat gpu-report.json
            - name: Node suite (Dawn on ${{ matrix.backend }})
              run: pnpm exec vitest run --project=node
            - name: Node suite, no-subgroups twins
              run: GRAPHTY_GPU_NO_SUBGROUPS=1 pnpm exec vitest run --project=node test/primitives test/layouts --passWithNoTests
            - name: Cache Playwright browsers
              id: pw
              uses: actions/cache@v4
              with: { path: ~/.cache/ms-playwright, key: "playwright-hosts-${{ runner.os }}-${{ hashFiles('packages/pnpm-lock.yaml') }}" }
            - if: steps.pw.outputs.cache-hit != 'true'
              run: pnpm exec playwright install chromium
            - name: Probe Chromium flag sets (informational -- which flags grant which adapter on this host)
              continue-on-error: true
              run: node scripts/probe-browser-flags.mjs
            - name: Browser smoke (Chromium on ${{ matrix.backend }})
              run: node scripts/run-browser-project.js
            - name: Browser smoke (WebKit, the Safari proxy) -- a spike until it is known to expose WebGPU
              if: matrix.webkit == 'true'
              continue-on-error: true
              env: { GRAPHTY_BROWSER: webkit }
              run: pnpm exec playwright install webkit && node scripts/run-browser-project.js
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: "hosts-${{ matrix.backend }}-${{ github.run_id }}"
                  path: |
                      packages/webgpu-graph-algorithms/gpu-report.json
                      packages/webgpu-graph-algorithms/browser-results.json
                  if-no-files-found: ignore
                  retention-days: 14
                  overwrite: true
