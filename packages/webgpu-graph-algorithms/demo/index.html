<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>GPU ForceAtlas2 demo</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #14171c;
                --panel: #1e232b;
                --ink: #e6e9ef;
                --dim: #9aa3b2;
                --accent: #4f9cff;
                --edge: rgba(150, 170, 200, 0.28);
            }
            html,
            body {
                margin: 0;
                height: 100%;
                background: var(--bg);
                color: var(--ink);
                font:
                    13px/1.4 system-ui,
                    sans-serif;
            }
            #app {
                display: grid;
                grid-template-columns: 300px 1fr;
                height: 100%;
            }
            #panel {
                background: var(--panel);
                padding: 14px 16px;
                overflow: auto;
                border-right: 1px solid #2c3340;
            }
            #panel h1 {
                font-size: 15px;
                margin: 0 0 10px;
            }
            #panel label {
                display: block;
                color: var(--dim);
                margin: 10px 0 4px;
            }
            #panel select,
            #panel input,
            #panel button {
                width: 100%;
                box-sizing: border-box;
                padding: 6px 8px;
                background: #262c36;
                color: var(--ink);
                border: 1px solid #38404e;
                border-radius: 4px;
                font: inherit;
            }
            #panel button {
                margin-top: 8px;
                cursor: pointer;
            }
            #panel button.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #08111f;
                font-weight: 600;
            }
            #stats {
                margin-top: 14px;
                border-top: 1px solid #2c3340;
                padding-top: 10px;
                font-family: ui-monospace, monospace;
                font-size: 12px;
                white-space: pre;
                color: var(--dim);
            }
            #status {
                margin-top: 10px;
                min-height: 2.8em;
                color: var(--dim);
            }
            #status.error {
                color: #ff7b7b;
            }
            #view {
                position: relative;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
                cursor: grab;
            }
            canvas.dragging {
                cursor: grabbing;
            }
            #hint {
                position: absolute;
                left: 12px;
                bottom: 10px;
                color: var(--dim);
                font-size: 12px;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div id="panel">
                <h1>GPU ForceAtlas2 (exact tier)</h1>
                <label for="graph">Graph</label>
                <select id="graph">
                    <option value="karate">Zachary karate club (34 / 78)</option>
                    <option value="grid">Grid 30 x 30 (900 / 1,740)</option>
                    <option value="random2k" selected>Random G(2,000, 6,000)</option>
                    <option value="clusters">Planted clusters (1,500 / 9,000)</option>
                    <option value="random10k">Random G(10,000, 30,000)</option>
                    <option value="rmat">R-MAT hub graph (16,384 / 131,072)</option>
                    <option value="random30k">Random G(30,000, 90,000)</option>
                </select>
                <label for="compat">Formulas</label>
                <select id="compat">
                    <option value="paper" selected>paper (Gephi / cuGraph)</option>
                    <option value="networkx">networkx</option>
                </select>
                <label for="ips">Iterations per frame</label>
                <input id="ips" type="number" min="1" max="64" value="2" />
                <label><input id="linlog" type="checkbox" style="width: auto" /> linlog</label>
                <label><input id="strong" type="checkbox" style="width: auto" /> strong gravity</label>
                <label><input id="edges" type="checkbox" style="width: auto" checked /> draw edges</label>
                <button id="play" class="primary">Pause</button>
                <button id="restart">Restart (new seed)</button>
                <button id="unpin">Unpin all</button>
                <div id="status">starting...</div>
                <div id="stats"></div>
            </div>
            <div id="view">
                <canvas id="canvas"></canvas>
                <div id="hint">
                    drag a node to move it (it stays pinned; click a pinned node to release it) - wheel to zoom
                </div>
            </div>
        </div>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
